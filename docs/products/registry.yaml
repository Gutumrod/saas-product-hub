# ==============================================================================
# SaaS Product Hub — Product Portfolio Registry
# ==============================================================================
# Product catalog and declared target configuration. Once the owner declares it,
# docs/platform/PORTFOLIO_PRODUCTION_MASTER_PLAN.md is the source of truth for the
# locked seven-product engineering sequence and production gates; ROADMAP.md remains
# historical portfolio context. A target deployment value below
# is not proof that an app exists, has been admitted to that runtime, or is live.
# Last Updated: 2026-08-27
#
# product_id / product_code: owner-approved 2026-08-26, full-portfolio adoption
# — see docs/platform/PRODUCT_ID_HOSTNAME_NAMESPACE_PROPOSAL.md for the model and
# decision log. product_id is a permanent internal identity (never reused, never
# displayed to customers). product_code is a permanent short portfolio code
# (never recycled even after retirement) reserved for future canonical hostnames
# of the form <code>.wstera.com — reservation is documentation-only here; no DNS
# record has been created for any product, including booking/BK01. `key` remains
# the existing repo/catalog identifier used elsewhere in this file and in code —
# it is NOT renamed or replaced by this change. Consistent with the Hub/root-domain
# note below (owner-confirmed 2026-08-24): wstera.com is the portfolio root: products
# get subdomains, they do not own it.
# ==============================================================================

version: "1.2"
platform: "SaaS Product Hub"
repository: "Gutumrod/saas-product-hub"
# delivery_model records the CEO-locked delivery contract, not price or financial status:
# subscription_saas | one_time_source_product. It is intentionally separate from
# deployment_model, which describes runtime topology.
# The Hub itself lives at apps/hub-web (repo Gutumrod/hub-web) and is not listed as a product
# below — it's the storefront, not one of the items for sale. Its domain is wstera.com (root,
# acquired 2026-08-23 via Cloudflare Registrar); individual products get subdomains under it
# (e.g. booking.wstera.com), they do not own the root domain. Confirmed by owner 2026-08-24.

# ------------------------------------------------------------------------------
# Release Waves
# ------------------------------------------------------------------------------
waves:
  wave_1:
    name: "First Hero Solution: Service Business Automation"
    focus: "Booking + LINE OA AI + Tracking"
    target: "Service SME businesses (Automotive, Salons, Clinics, Repair Shops)"
    status: "active"
  wave_2:
    name: "Ecosystem & Developer Toolkit"
    focus: "Headless Commerce, Multi-Tenant AI Starter, Stripe Billing"
    target: "SaaS Builders, Tech SMEs, E-commerce Merchants"
    status: "planned"
  wave_3:
    name: "Enterprise & High-Scale Automation"
    focus: "Bulk ETL, Content Auto-Pilot, IT Ops Watchdog, Compliance"
    target: "Enterprise & High-Volume Clients"
    status: "backlog"

